name: Hourly Data & Prediction

on:
  schedule:
    - cron: '3,18,33,48 * * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard - skip if last run < 13 minutes
        run: |
          FILE="data/_timestamp.txt"
          if [ -f "$FILE" ]; then
            LAST=$(date -u -d "$(cat $FILE)" +%s || true)
            NOW=$(date -u +%s)
            DIFF=$(( NOW - LAST ))
            echo "Last run was $DIFF seconds ago"
            if [ $DIFF -lt 780 ]; then
              echo "Recent run detected (< 13 min). Skipping this schedule."
              exit 0
            fi
          fi

      - name: Install cairosvg system deps
        run: sudo apt-get install -y libcairo2

      - name: Write logs auth config (SHA-256 hashed)
        env:
          LOGS_USERNAME: ${{ secrets.LOGS_USERNAME }}
          LOGS_PASSWORD: ${{ secrets.LOGS_PASSWORD }}
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import hashlib, json, os
          username = os.environ["LOGS_USERNAME"]
          password = os.environ["LOGS_PASSWORD"]
          pwd_hash = hashlib.sha256(password.encode()).hexdigest()
          with open("data/logs_auth.json", "w") as f:
              json.dump({"username": username, "password_hash": pwd_hash}, f)
          print(f"logs_auth.json written — username={username}, hash={pwd_hash[:12]}...")
          PYEOF

      - name: Generate data & prediction
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COINDESK_API_KEY: ${{ secrets.COINDESK_API_KEY }}
        run: |
          python scripts/fetch_predict.py
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/_timestamp.txt

      - name: Commit & push (as fbrianzy)
        run: |
          git config user.name "fbrianzy"
          git config user.email "164667693+fbrianzy@users.noreply.github.com"
          git add data/*.json data/_timestamp.txt
          git commit -m "Auto update by fbrianzy: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Show last commit (debug)
        run: git log -1 --pretty=fuller
